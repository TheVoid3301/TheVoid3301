name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TheVoid3301
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0f766e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4

      - name: Publish snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
